<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RailSense gives Indian Railways passengers live train tracking and dynamic arrival forecasts for coaching trains."
    />
    <meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d151a" media="(prefers-color-scheme: dark)" />
    <title>RailSense — Live train tracking and dynamic ETA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applied before first paint so the chosen theme never flashes.
      (function () {
        try {
          var stored = localStorage.getItem('railsense-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
          var lang = localStorage.getItem('railsense-language');
          if (lang) document.documentElement.lang = lang;
        } catch (e) {
          /* storage unavailable — fall back to the light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
